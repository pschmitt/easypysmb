name: Python Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
    - name: Python lint
      uses: pschmitt/ci-workflows/.github/actions/python-lint@main
      with:
        python-version: ${{ matrix.python-version }}
        flake8-mode: custom
        requirements-file: requirements.txt
        flake8-args: --count --select=E9,F63,F7,F82 --show-source --statistics .
        flake8-warning-args: --count --exit-zero --max-complexity=10 --max-line-length=80 --statistics .
        black-args: --check --line-length=80 --diff .

    - name: Install package and check import
      run: |
        python -m pip install .
        python -c "import easypysmb"
